<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GroupDrive — проверка работ</title><style>
:root{color-scheme:dark;--bg:#080e1d;--panel:#101b31;--line:#263858;--text:#eff4ff;--muted:#93a7cc;--blue:#5060ff;--cyan:#5ad9f4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% -20%,#23386b,transparent 50%),var(--bg);color:var(--text);font:15px/1.5 Inter,"Segoe UI",Arial,sans-serif}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid #1d2b48;background:#080f20}.brand{font-size:25px;font-weight:850}.brand b{color:var(--cyan)}a{color:#80e4f4}.wrap{max-width:1200px;margin:auto;padding:26px}.hero{padding:26px 30px;border-radius:20px;background:linear-gradient(115deg,#16447c,#343d9c 58%,#714cae);margin-bottom:22px}.hero h1{margin:0 0 7px;font-size:clamp(26px,4vw,36px)}.hero p{margin:0;color:#e0e9ff}.panel{background:linear-gradient(145deg,#101d34,#0b1426);border:1px solid #263858;border-radius:17px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#0a1428;border:1px solid #253858;border-radius:13px;padding:16px}.muted,small{color:var(--muted)}label{display:block;margin:12px 0 6px;color:#c7d4ee;font-size:13px}input,textarea,select{width:100%;border:1px solid #293d61;border-radius:10px;padding:12px;background:#0a1428;color:white;font:inherit}textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #2b3d60;border-radius:10px;background:#14213a;padding:10px 14px;color:white;text-decoration:none;font:inherit;font-weight:650;cursor:pointer;margin-top:10px}.btn.primary{background:linear-gradient(110deg,#4b5fff,#6b4fff);border-color:transparent}.btn.danger{background:#472035;border-color:#743b58}.btn:disabled{opacity:.5;cursor:not-allowed}.notice{display:none;padding:12px 15px;border-radius:10px;margin:12px 0}.notice.show{display:block}.notice.error{background:#441d2c;color:#ffd9e1}.notice.success{background:#12382f;color:#c8ffed}.status{display:inline-block;border-radius:7px;padding:3px 8px;font-size:12px;background:#263858}.status.accepted{background:#164d3c;color:#b9ffde}.status.revision{background:#583422;color:#ffe2b2}.status.pending{background:#3b315f;color:#e8ddff}.actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions{display:flex;gap:10px;flex-wrap:wrap}h2{margin:0 0 14px}hr{border:0;border-top:1px solid #253858;margin:18px 0}.hidden{display:none!important}@media(max-width:650px){.wrap{padding:14px}.top{padding:14px}.row{grid-template-columns:1fr}.hero{padding:22px}}
</style></head><body>
<header class="top"><div class="brand">☁ Group<b>Drive</b></div><div class="top-actions"><a class="btn" href="/dashboard.html">← К файлам</a><a class="btn" href="/admin.html" id="adminBtn" style="display:none">⚙ Администратор</a></div></header>
<div class="wrap"><section class="hero"><h1 id="title">Проверка работ</h1><p id="subtitle">Преподаватели оставляют статус и комментарии к загруженным работам.</p></section><div id="notice" class="notice"></div><div id="list" class="grid"><div class="panel">Загружаем…</div></div></div>
<script>(()=>{const $=id=>document.getElementById(id);let me;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>n<1024?n+' Б':n<1048576?(n/1024).toFixed(1)+' КБ':(n/1048576).toFixed(1)+' МБ';async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка запроса');return d}function say(t,e=false){$('notice').textContent=t;$('notice').className='notice show '+(e?'error':'success')}const labels={pending:'На проверке',accepted:'Принято',revision:'Нужна доработка'};
async function init(){try{me=await api('/api/me');if(me.role==='admin')$('adminBtn').style.display='inline-flex';if(['teacher','admin'].includes(me.role)){$('title').textContent='Работы учеников';$('subtitle').textContent='Открой файл, поставь статус проверки и оставь комментарий.'}else{$('title').textContent='Мои оценки';$('subtitle').textContent='Здесь появятся статусы и комментарии преподавателей к твоим файлам.'}const rows=await api('/api/reviews');render(rows)}catch(e){say(e.message,true);$('list').innerHTML='<div class="panel">Не удалось загрузить работы. <a href="/login.html">Войди в аккаунт</a>.</div>'}}
function render(rows){if(!rows.length){$('list').innerHTML='<div class="panel">Пока нет работ для отображения.</div>';return}const staff=['teacher','admin'].includes(me.role);$('list').innerHTML=rows.map(f=>{const stat=f.status||'pending';const owner=staff?`<p class="muted">Ученик: ${esc(f.student_name)} · ${esc(f.student_email)}</p>`:'';const review=staff?`<label>Статус проверки</label><select id="s-${f.file_id}"><option value="pending" ${stat==='pending'?'selected':''}>На проверке</option><option value="accepted" ${stat==='accepted'?'selected':''}>Принято</option><option value="revision" ${stat==='revision'?'selected':''}>Нужна доработка</option></select><label>Комментарий к работе</label><textarea id="c-${f.file_id}" placeholder="Что получилось хорошо, что исправить…">${esc(f.comment||'')}</textarea><button class="btn primary" data-save="${f.file_id}">Сохранить проверку</button>`:`<p><span class="status ${stat}">${labels[stat]||'На проверке'}</span></p><p>${f.comment?esc(f.comment):'Преподаватель пока не оставил комментарий.'}</p><p class="muted">${f.reviewed_by?'Проверил(а): '+esc(f.reviewed_by):'Ещё не проверено'}</p>`;return `<article class="card"><h2>${esc(f.original_name)}</h2>${owner}<p class="muted">Размер: ${fmt(Number(f.size)||0)} · добавлен: ${esc(f.created_at||'')}</p><div class="actions"><a class="btn" target="_blank" href="/api/files/${f.file_id}/download?inline=1">Просмотреть</a><button class="btn" data-share="${f.file_id}">Создать ссылку</button></div><hr>${review}</article>`}).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{try{await api('/api/files/'+b.dataset.save+'/review',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('s-'+b.dataset.save).value,comment:$('c-'+b.dataset.save).value})});say('Проверка сохранена');init()}catch(e){say(e.message,true)}});document.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{try{const d=await api('/api/share/'+b.dataset.share,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({allow_download:false})});prompt('Ссылка на работу:',d.url)}catch(e){say(e.message,true)}})}init()})();</script></body></html>
