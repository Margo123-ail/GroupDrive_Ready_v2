<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e1d"><title>GroupDrive — работы</title><style>
:root{color-scheme:dark;--bg:#080e1d;--panel:#101b31;--line:#263858;--text:#eff4ff;--muted:#93a7cc;--cyan:#5ad9f4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% -20%,#23386b,transparent 50%),var(--bg);color:var(--text);font:15px/1.5 Inter,"Segoe UI",Arial,sans-serif}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid #1d2b48;background:#080f20}.brand{font-size:25px;font-weight:850}.brand b{color:var(--cyan)}a{color:#80e4f4}.wrap{max-width:1200px;margin:auto;padding:26px}.hero{padding:26px 30px;border-radius:20px;background:linear-gradient(115deg,#16447c,#343d9c 58%,#714cae);margin-bottom:22px}.hero h1{margin:0 0 7px;font-size:clamp(26px,4vw,36px)}.hero p{margin:0;color:#e0e9ff}.panel{background:linear-gradient(145deg,#101d34,#0b1426);border:1px solid var(--line);border-radius:17px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{background:#0a1428;border:1px solid #253858;border-radius:13px;padding:17px;min-width:0}.muted,small{color:var(--muted)}label{display:block;margin:12px 0 6px;color:#c7d4ee;font-size:13px}input,textarea,select{width:100%;border:1px solid #293d61;border-radius:10px;padding:12px;background:#0a1428;color:white;font:inherit}textarea{min-height:96px;resize:vertical}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #2b3d60;border-radius:10px;background:#14213a;padding:10px 14px;color:white;text-decoration:none;font:inherit;font-weight:650;cursor:pointer;margin-top:10px}.btn.primary{background:linear-gradient(110deg,#4b5fff,#6b4fff);border-color:transparent}.btn:disabled{opacity:.5;cursor:not-allowed}.notice{display:none;padding:12px 15px;border-radius:10px;margin:12px 0}.notice.show{display:block}.notice.error{background:#441d2c;color:#ffd9e1}.notice.success{background:#12382f;color:#c8ffed}.status{display:inline-block;border-radius:7px;padding:3px 8px;font-size:12px;background:#263858}.status.accepted{background:#164d3c;color:#b9ffde}.status.revision{background:#583422;color:#ffe2b2}.status.pending{background:#3b315f;color:#e8ddff}.actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions{display:flex;gap:10px;flex-wrap:wrap}h2{margin:0 0 14px}.empty{padding:22px;border:1px dashed #304264;border-radius:13px;color:var(--muted)}.person-name{font-size:19px;font-weight:750;margin:8px 0 4px}.badge{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;background:#263858;color:#dbe8ff}.badge.student{background:#173b53;color:#bcefff}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}hr{border:0;border-top:1px solid #253858;margin:18px 0}.small{font-size:12px;color:var(--muted)}@media(max-width:650px){.wrap{padding:14px}.top{padding:14px}.hero{padding:22px}}
</style></head><body>
<header class="top"><div class="brand">☁ Group<b>Drive</b></div><div class="top-actions"><a class="btn" href="/dashboard.html">← К файлам</a><a class="btn" href="/admin.html" id="adminBtn" style="display:none">⚙ Администратор</a></div></header>
<main class="wrap"><section class="hero"><h1 id="title">Работы</h1><p id="subtitle">Загружаем данные…</p></section><div id="notice" class="notice" role="status"></div><div id="backRow" class="section-head" style="margin:0 0 15px"></div><div id="list" class="grid"><div class="panel">Загружаем…</div></div></main>
<script>
(()=>{
 const $=id=>document.getElementById(id);let me;const qs=new URLSearchParams(location.search);const studentId=qs.get('student_id');
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>n<1024?n+' Б':n<1048576?(n/1024).toFixed(1)+' КБ':(n/1048576).toFixed(1)+' МБ';
 async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка запроса');return d}
 function say(t,isError=false){$('notice').textContent=t;$('notice').className='notice show '+(isError?'error':'success')}
 const labels={pending:'На проверке',accepted:'Принято',revision:'Нужна доработка'};
 function sortSurname(rows){const last=x=>String(x.name||'').trim().split(/\s+/).slice(-1)[0]||x.name||'';return rows.sort((a,b)=>last(a).localeCompare(last(b),'ru')||String(a.name).localeCompare(String(b.name),'ru'))}
 async function init(){try{me=await api('/api/me');const staff=['teacher','admin'].includes(me.role);if(me.role==='admin')$('adminBtn').style.display='inline-flex';if(staff){if(studentId){await showOneStudent(Number(studentId))}else{await showStudentRoster()}}else{if(studentId){$('list').innerHTML='<div class="empty">Нет доступа к чужим работам.</div>';return}$('title').textContent='Мои оценки';$('subtitle').textContent='Здесь появятся статусы и комментарии преподавателей к твоим работам.';const rows=await api('/api/reviews');renderFiles(rows,false)}}catch(e){say(e.message,true);$('list').innerHTML='<div class="panel">Не удалось загрузить данные. <a href="/login.html">Войди в аккаунт</a>.</div>'}}
 async function showStudentRoster(){
  const students = sortSurname(await api('/api/students'));
  $('title').textContent = 'Студенты и их работы';
  $('subtitle').textContent = 'Выбери учебную группу, затем студента и папку предмета.';
  $('backRow').innerHTML = '';

  const groups = {};
  students.forEach(s => {
    const name = s.group_name || 'Без учебной группы';
    if (!groups[name]) groups[name] = [];
    groups[name].push(s);
  });

  const groupNames = Object.keys(groups).sort((a,b) => a.localeCompare(b,'ru'));

  $('list').innerHTML = groupNames.length ? groupNames.map(group => `
    <section class="card">
      <h2>📁 ${esc(group)}</h2>
      <div class="student-list">
        ${groups[group].map(s => `
          <article class="card">
            <span class="badge student">Студент</span>
            <h2 class="person-name">${esc(s.name)}</h2>
            <p class="muted">${esc(s.email || '')}</p>
            <p class="small">Загружено файлов: ${Number(s.files_count)||0}</p>
            <a class="btn primary" href="/reviews.html?student_id=${s.id}">
              Открыть папки →
            </a>
          </article>
        `).join('')}
      </div>
    </section>
  `).join('') : '<div class="empty">Пока нет студентов.</div>';
}

async function showOneStudent(id){
  const workspace = await api('/api/students/' + encodeURIComponent(id) + '/workspace');
  const student = workspace.student;
  if (!student) throw Error('Студент не найден.');

  const folders = workspace.folders || [];
  const allFiles = workspace.files || [];
  const currentId = qs.get('folder_id');
  const currentFolderId = currentId ? Number(currentId) : null;

  if (currentFolderId && !folders.some(f => Number(f.id) === currentFolderId)) {
    throw Error('Папка не найдена.');
  }

  const currentFolder = currentFolderId
    ? folders.find(f => Number(f.id) === currentFolderId)
    : null;

  $('title').textContent = student.name;
  $('subtitle').textContent =
    (student.group_name ? student.group_name + ' · ' : '') +
    (student.email || '') + ' · файлов: ' + allFiles.length;

  const trail = [];
  let parent = currentFolder;
  while (parent) {
    trail.unshift(parent);
    parent = parent.parent_id
      ? folders.find(f => Number(f.id) === Number(parent.parent_id))
      : null;
  }

  const rootUrl = '/reviews.html?student_id=' + id;
  $('backRow').innerHTML =
    '<a class="btn" href="/reviews.html">← К списку студентов</a> ' +
    '<a class="btn" href="' + rootUrl + '">📁 Все папки</a> ' +
    trail.map((f, i) => {
      const url = rootUrl + '&folder_id=' + f.id;
      return '<a class="btn" href="' + url + '">' + esc(f.name) + '</a>';
    }).join(' ');

  const childFolders = folders
    .filter(f => currentFolderId
      ? Number(f.parent_id) === currentFolderId
      : f.parent_id == null)
    .sort((a,b) => String(a.name).localeCompare(String(b.name),'ru'));

  const files = allFiles
    .filter(f => currentFolderId
      ? Number(f.folder_id) === currentFolderId
      : f.folder_id == null)
    .map(f => ({
      ...f,
      file_id: f.id,
      student_name: student.name
    }));

  renderFiles(files, true);

  const folderHtml = childFolders.map(f => `
    <article class="card">
      <h2>📁 ${esc(f.name)}</h2>
      <p class="muted">Папка с файлами или вложенными папками</p>
      <a class="btn primary"
         href="${rootUrl}&folder_id=${f.id}">
        Открыть папку →
      </a>
    </article>
  `).join('');

  if (folderHtml) {
    $('list').insertAdjacentHTML('afterbegin', folderHtml);
  }

  if (!childFolders.length && !files.length) {
    $('list').innerHTML =
      '<div class="empty">В этой папке пока нет файлов или вложенных папок.</div>';
  }
}function renderFiles(rows,staff){if(!rows.length){$('list').innerHTML='<div class="empty">У этого ученика пока нет загруженных работ.</div>';return}const staffCanEdit=staff; $('list').innerHTML=rows.map(f=>{const stat=f.status||'pending';const review=staffCanEdit?`<label for="s-${f.file_id}">Статус проверки</label><select id="s-${f.file_id}"><option value="pending" ${stat==='pending'?'selected':''}>На проверке</option><option value="accepted" ${stat==='accepted'?'selected':''}>Принято</option><option value="revision" ${stat==='revision'?'selected':''}>Нужна доработка</option></select><label for="c-${f.file_id}">Комментарий к работе</label><textarea id="c-${f.file_id}" placeholder="Что получилось хорошо, что исправить…">${esc(f.comment||'')}</textarea><button class="btn primary" data-save="${f.file_id}">Сохранить проверку</button><button class="btn" data-perm="${f.file_id}" data-allow="${f.can_download?0:1}">${f.can_download?'Запретить скачивание':'Разрешить скачивание'}</button>`:`<p><span class="status ${stat}">${labels[stat]||'На проверке'}</span></p><p>${f.comment?esc(f.comment):'Преподаватель пока не оставил комментарий.'}</p><p class="muted">${f.reviewed_by?'Проверил(а): '+esc(f.reviewed_by):'Ещё не проверено'}</p>`;return `<article class="card"><h2>${esc(f.original_name)}</h2>${staffCanEdit?`<p class="muted">Студент: ${esc(f.student_name||'')}</p>`:''}<p class="muted">Размер: ${fmt(Number(f.size)||0)} · добавлен: ${esc(f.created_at||'')}</p><p class="small">${f.can_download?'Скачивание разрешено':'Скачивание запрещено преподавателем'}</p><div class="actions"><a class="btn" target="_blank" rel="noopener" href="/api/files/${f.file_id}/download?inline=1">Просмотреть</a><a class="btn" href="/api/files/${f.file_id}/download" ${!f.can_download&& !['teacher','admin'].includes(me.role)?'aria-disabled="true"':''}>Скачать</a><button class="btn" data-share="${f.file_id}">Создать ссылку</button></div><hr>${review}</article>`}).join('');
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{try{await api('/api/files/'+b.dataset.save+'/review',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('s-'+b.dataset.save).value,comment:$('c-'+b.dataset.save).value})});say('Проверка сохранена. Комментарий появится у ученика.');await init()}catch(e){say(e.message,true)}});
  document.querySelectorAll('[data-perm]').forEach(b=>b.onclick=async()=>{try{const allow=b.dataset.allow==='1';await api('/api/files/'+b.dataset.perm+'/permissions',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({can_download:allow})});say(allow?'Скачивание разрешено.':'Скачивание запрещено.');await init()}catch(e){say(e.message,true)}});
  document.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{try{const d=await api('/api/share/'+b.dataset.share,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({allow_download:false})});prompt('Скопируй ссылку на работу:',d.url)}catch(e){say(e.message,true)}})
 }
 init();
})();
</script></body></html>
